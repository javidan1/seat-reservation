services:
  postgres:
    image: postgres:16-alpine
    container_name: seatres-postgres
    environment:
      POSTGRES_DB: seatres
      POSTGRES_USER: seatres
      POSTGRES_PASSWORD: seatres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatres -d seatres"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - seatres-pgdata:/var/lib/postgresql/data

volumes:
  seatres-pgdata:
