name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verification gate (format + fast tests, Testcontainers)
        run: ./gradlew spotlessCheck test

  # Every push scans the ENTIRE git history for leaked credentials — a secret
  # committed then deleted is still leaked, so the tip alone is never enough.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Feeds the resolved (transitive) dependency graph to GitHub so Dependabot
  # alerts cover what Gradle actually ships, not just what build.gradle.kts names.
  dependency-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@v4
        env:
          # Scan what ships and what runs in CI — app classpaths only. The Gradle
          # plugins' own bundled dependencies (buildscript classpath) are pinned by
          # the plugins and not part of the delivered artifact.
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: "(compileClasspath|runtimeClasspath|testCompileClasspath|testRuntimeClasspath)"
