name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are cancelled; main pushes queue instead — cancelling a
# main run could skip a dependency-graph submission.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs declare anything more themselves.
# Actions are pinned to commit SHAs (tags are mutable; Dependabot bumps the pins).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Verification gate (format + fast tests, Testcontainers)
        run: ./gradlew spotlessCheck test

  # Every push scans the ENTIRE git history for leaked credentials — a secret
  # committed then deleted is still leaked, so the tip alone is never enough.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dependabot-triggered runs get a restricted token; gitleaks lists PR commits
    # via the API, so grant the read scopes it needs explicitly.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Feeds the resolved (transitive) dependency graph to GitHub so Dependabot
  # alerts cover what Gradle actually ships, not just what build.gradle.kts names.
  dependency-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        env:
          # Scan what ships and what runs in CI — app classpaths only. The Gradle
          # plugins' own bundled dependencies (buildscript classpath) are pinned by
          # the plugins and not part of the delivered artifact.
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: "(compileClasspath|runtimeClasspath|testCompileClasspath|testRuntimeClasspath)"
